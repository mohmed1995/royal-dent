<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3B8" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#B88A2E" />
      <stop offset="100%" stop-color="#8C6615" />
    </linearGradient>
    <linearGradient id="glowLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB8" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#goldShadow)">
    <!-- Continuous Crown-Tooth Outline Stroke -->
    <!-- Crown 3 Peaks -->
    <path d="M 175 185 
             L 250 135 
             L 325 185 
             L 385 185 
             L 345 235 
             C 385 275, 395 345, 360 410 
             C 335 455, 295 460, 270 415 
             C 255 385, 250 330, 250 295 
             C 250 330, 245 385, 230 415 
             C 205 460, 165 455, 140 410 
             C 105 345, 115 275, 155 235 
             L 115 185 
             Z" 
          fill="none" 
          stroke="url(#goldLinear)" 
          stroke-width="16" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Inner V and Diamond faceted structure of the Crown -->
    <path d="M 180 190 
             L 250 250 
             L 320 190" 
          fill="none" 
          stroke="url(#goldLinear)" 
          stroke-width="16" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Central Inner Ridge Line -->
    <path d="M 250 250 L 250 300" 
          fill="none" 
          stroke="url(#goldLinear)" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- Symmetrical Inner Tooth Arch Contour -->
    <path d="M 195 275 
             C 180 330, 190 395, 230 415 
             C 250 375, 250 300, 250 280 
             C 250 300, 250 375, 270 415 
             C 310 395, 320 330, 305 275" 
          fill="none" 
          stroke="url(#glowLinear)" 
          stroke-width="12" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
  </g>
</svg>
