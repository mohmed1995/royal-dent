<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="royalNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#003366" />
      <stop offset="100%" stop-color="#001833" />
    </linearGradient>
    <linearGradient id="goldCrownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
    <linearGradient id="cyanDentalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shield Card -->
  <rect x="25" y="25" width="450" height="450" rx="60" fill="url(#royalNavyGrad)" stroke="url(#goldCrownGrad)" stroke-width="6" filter="url(#royalShadow)" />

  <!-- Inner Subtle Accent Border -->
  <rect x="40" y="40" width="420" height="420" rx="48" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- Royal Crown Emblem at Top -->
  <g transform="translate(160, 80) scale(0.9)">
    <path d="M 10 55 L 45 10 L 100 45 L 155 10 L 190 55 Z" fill="url(#goldCrownGrad)" filter="url(#royalShadow)" />
    <!-- Crown Jewels -->
    <circle cx="45" cy="10" r="7" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2" />
    <circle cx="100" cy="45" r="7" fill="#0EA5E9" stroke="#FFE082" stroke-width="2" />
    <circle cx="155" cy="10" r="7" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2" />
    <rect x="15" y="58" width="170" height="10" rx="5" fill="url(#goldCrownGrad)" />
  </g>

  <!-- Central Anatomical Dental Tooth with Medical Gloss -->
  <g transform="translate(170, 165) scale(0.8)">
    <path d="M 100 15 
             C 145 15, 175 45, 185 85 
             C 195 125, 185 165, 175 205 
             C 165 245, 145 285, 135 320 
             C 130 338, 120 345, 110 335 
             C 95 320, 95 270, 100 240
             C 105 270, 105 320, 90 335
             C 80 345, 70 338, 65 320
             C 55 285, 35 245, 25 205
             C 15 165, 5 125, 15 85
             C 25 45, 55 15, 100 15 Z" 
          fill="url(#cyanDentalGlow)" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          filter="url(#royalShadow)" />
    
    <!-- Tooth Inner Sparkle / Enamel Reflection -->
    <path d="M 45 70 C 55 40, 85 30, 115 32 C 85 45, 60 70, 52 105 Z" fill="#FFFFFF" opacity="0.6" />
    <!-- Center Luxury Cross / Star -->
    <circle cx="100" cy="120" r="8" fill="#FFE082" />
  </g>

  <!-- Brand Typography -->
  <text x="250" y="380" font-family="'El Messiri', 'Cairo', serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    مركز رويال للأسنان
  </text>
  <text x="250" y="415" font-family="'Cinzel', 'Trajan Pro', serif" font-size="20" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="4">
    ROYAL DENT DAIRUT
  </text>
  <text x="250" y="445" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle">
    فرع ديروط • ميدان أبو جبل
  </text>
</svg>